name: liyaplayer
description: "LihaPlayer - Windows desktop media player"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Audio & Video
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  video_player: ^2.9.2

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # File System
  file_picker: ^8.0.0+1
  path_provider: ^2.1.1
  path: ^1.8.3

  # Networking
  dio: ^5.4.0
  cached_network_image: ^3.3.1

  # UI Components
  flutter_screenutil: ^5.9.0
  audio_video_progress_bar: ^1.0.0

# Windows Integration
  window_manager: ^0.3.9
  system_tray: ^2.0.3
  win32: ^5.5.0
  ffi: ^2.2.0

  # Routing
  go_router: ^13.0.0

  # Utilities (code generation)
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Audio Metadata
  audio_metadata_reader: ^1.4.2

  # Icons
  cupertino_icons: ^1.0.8

  # Utilities
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_test: ^1.0.1
  mockito: ^5.4.2
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code Generation
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  freezed: ^2.4.5
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/icons/